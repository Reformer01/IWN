<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, sans-serif; font-size: 13px; padding: 8px; color: #1a1a1a; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input, select { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 4px; }
    button { margin-top: 14px; width: 100%; padding: 8px; background: #F58C29; color: #fff; border: 0; font-weight: bold; cursor: pointer; }
    .msg { margin-top: 10px; }
  </style>
</head>
<body>
  <p>Field discovery — appends to Raw Inbound and routes once.</p>
  <label>Company *</label>
  <input id="company" required>
  <label>Contact / role</label>
  <input id="contact">
  <label>Email</label>
  <input id="email" type="email">
  <label>Phone</label>
  <input id="phone">
  <label>Location (city / state) *</label>
  <input id="location" placeholder="Sagamu, Ogun">
  <label>Sector</label>
  <select id="sector">
    <option>Corporate / Industrial</option>
    <option>Hospitality</option>
    <option>Education</option>
    <option>Healthcare</option>
    <option>Industrial Manufacturing</option>
    <option>Finance</option>
    <option>Government</option>
    <option>Estate / Campus</option>
  </select>
  <label>Source URL (optional)</label>
  <input id="sourceUrl">
  <button onclick="submitLead()">Add lead</button>
  <div class="msg" id="msg"></div>
  <script>
    function submitLead() {
      const payload = {
        company: document.getElementById('company').value.trim(),
        contact: document.getElementById('contact').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        location: document.getElementById('location').value.trim(),
        sector: document.getElementById('sector').value,
        sourceUrl: document.getElementById('sourceUrl').value.trim()
      };
      if (!payload.company || !payload.location) {
        document.getElementById('msg').textContent = 'Company and location are required.';
        return;
      }
      document.getElementById('msg').textContent = 'Saving…';
      google.script.run
        .withSuccessHandler(function (m) {
          document.getElementById('msg').textContent = m;
          document.getElementById('company').value = '';
        })
        .withFailureHandler(function (err) {
          document.getElementById('msg').textContent = String(err);
        })
        .submitManualLead(payload);
    }
  </script>
</body>
</html>
